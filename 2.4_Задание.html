<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Задание</title>
  <style>
    .parent {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .elem {
      width: 150px;
      background-color: #005250;
      color: #fff;
      padding: 15px;
    }
    .left {
      display: flex;
      flex-direction: column;   
      gap: 10px;
    }
    .right {
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="parent">
    <div class="left">
      <div class="elem">1</div>
      <div class="elem">2</div>
      <div class="elem">3</div>
    </div>
    <div class="right">
      <div class="elem">4</div>
      <div class="elem">5</div>
    </div>
  </div>
</body>
</html>
